plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    archives sourcesJar
}

dependencies {
    implementation 'org.gwtproject:gwt-user:2.13.1'
    implementation 'org.gwtproject:gwt-dev:2.13.1'
}

publishing {
    publications {
        gwtAndroidEmu(MavenPublication) {
            from components.java
            artifactId = 'gwt-android-emu'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/mobialia/gwt-android-emu')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

shadowJar {
    archiveBaseName.set('generate-resources')
    archiveClassifier.set('fat')
    archiveVersion.set('')
}

jar {
    manifest.attributes('Main-Class': 'android.utils.GenerateResources')
}